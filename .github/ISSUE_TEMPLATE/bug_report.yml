name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the backend with ...
        2. Open the strategy builder and ...
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How are you running OpenQnt?
      options: [Local (no Docker), Docker, Desktop app]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: macOS 15, Node 20.18, Python 3.12.7
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any API keys or account numbers first.
      render: shell
